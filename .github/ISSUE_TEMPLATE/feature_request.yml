name: Feature Request
description: Suggest an idea or improvement for Gradeway
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For larger changes (new drivers, new commands, config model
        changes), it's worth discussing on [Discord](https://discord.gg/f35EemU4jS) first before
        anyone invests time in an implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is this related to a limitation or missing functionality you've run into?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Related platform(s), if applicable
      multiple: true
      options:
        - Bukkit
        - Paper
        - BungeeCord
        - Velocity
        - Not platform-specific
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that would help understand the request.
    validations:
      required: false
