name: Bug Report
description: Report something that isn't working as expected
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Gradeway is still pre-release, so please check
        [existing issues](https://github.com/GradientTim/gradeway/issues) first — you may be
        hitting a known limitation. For quick questions, the
        [Discord server](https://discord.gg/f35EemU4jS) is often faster than an issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Bukkit
        - Paper
        - BungeeCord
        - Velocity
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform / Minecraft version
      placeholder: e.g. Paper 1.21.1
    validations:
      required: true

  - type: input
    id: gradeway-version
    attributes:
      label: Gradeway version / commit
      placeholder: e.g. commit hash or build date, since there are no versioned releases yet
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: Database / messaging driver(s) in use
      placeholder: e.g. driver-database-postgres, driver-messaging-redis
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Paste any relevant console output. This will be rendered as code, no need for backticks.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste relevant parts of your Gradeway TOML config (remove credentials/secrets first).
      render: toml
    validations:
      required: false
