[versions]
arrow = "2.2.3"
exposed = "1.5.0"
adventure = "5.2.0"
kotlinx-serialization = "1.11.0"

[libraries]
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version = "3.3.0" }
koin-core = { module = "io.insert-koin:koin-core", version = "4.2.2" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
mojang-brigadier = { module = "com.mojang:brigadier", version = "1.3.10" }
cdimascio-dotenv = { module = "io.github.cdimascio:dotenv-java", version = "3.2.0" }
google-devtools-ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version = "2.3.12" }
apache-commons-compress = { module = "org.apache.commons:commons-compress", version = "1.28.0" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }

kyori-adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
kyori-adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }

akuleshov7-ktoml-core = { module = "com.akuleshov7:ktoml-core", version = "0.7.1" }

exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-migration-core = { module = "org.jetbrains.exposed:exposed-migration-core", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }

[bundles]
exposed = ["exposed-dao", "exposed-core", "exposed-jdbc", "exposed-java-time"]
exposed-migration = ["exposed-migration-core", "exposed-migration-jdbc"]
adventure = ["kyori-adventure", "kyori-adventure-minimessage"]
